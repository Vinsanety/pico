<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico - Summit Log</title>
    <!-- Favicon  Support-->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Pico" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="banner">⚠️ Prototype Demo — Work in Progress ⚠️</div>

    <header class="mobile-header">
      <img src="/logo/Pico-Summit-Log_FULL-LOGO.svg" alt="Pico Summit Log" />
    </header>

    <div class="app">
      <!-- Sidebar -->
      <aside>
        <header class="desktop-header">
          <img
            src="/logo/Pico-Summit-Log_FULL-LOGO.svg"
            alt="Pico Summit Log"
          />
          <div class="subheader muted">
            Log summits and track your progress.
          </div>
        </header>
        <!-- Map/Table Toggle Button -->
        <div class="toggle-view-container">
          <!-- Map Radio -->
          <input type="radio" id="map-view-radio" name="view" checked />
          <label for="map-view-radio">Map</label>
          <!-- Table Radio -->
          <input type="radio" id="table-view-radio" name="view" />
          <label for="table-view-radio">Table</label>
        </div>

        <!-- My Recent Summits Container -->
        <div id="my-recent-summits-container" class="view active">
          <h3 class="my-summits-heading">
            Total Summits:&nbsp;
            <span id="my-summit-count">-</span>
          </h3>

          <!-- Submit Summit Button -->
          <button id="add-summit-btn" class="primary-btn">Add Summit</button>

          <!-- Recent Summits List (last 5 logged)-->
          <h4>Recent Summits</h4>
          <ul id="recent-summits-list"></ul>
        </div>

        <!-- Main Form -->
        <form id="add-summit-form" class="view">
          <h3>Log a Summit</h3>

          <div class="form-fields-container">
            <!-- Date Input -->
            <div class="form-field">
              <label for="summit-date">Date climbed</label>
              <input id="summit-date" type="date" />
            </div>

            <!-- Summit Name Combobox -->
            <div class="form-field">
              <label for="summit-input">Summit</label>
              <input
                id="summit-input"
                type="text"
                placeholder="Start typing a peak…"
                autocomplete="off"
              />
              <ul id="peak-suggestions"></ul>
            </div>

            <!-- Elevation Input -->
            <div class="form-field">
              <label for="summit-elevation">Elevation (ft)</label>
              <input
                id="summit-elevation"
                type="number"
                placeholder="e.g. 14265"
              />
            </div>

            <!-- Preview Summit before submitting -->
            <div id="add-summit-preview"></div>

            <!-- Log or Cancel Buttons -->
            <div class="form-actions">
              <button
                type="button"
                id="cancel-add-summit-btn"
                class="secondary-btn"
              >
                Cancel
              </button>
              <button type="submit" class="primary-btn">Log Summit</button>
            </div>
          </div>
        </form>
      </aside>

      <div id="view-wrapper">
        <!-- Map View -->
        <div id="map" class="view active">
          <button id="preview-mode-banner" type="button">
            Close Preview Mode
          </button>
        </div>

        <!-- Table View -->
        <div id="my-summits-table" class="view"></div>
      </div>

      <!-- Reusable Modal -->
      <div
        id="app-modal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-describedby="modal-body"
      >
        <div class="modal-content">
          <h3 id="modal-title"></h3>
          <div id="modal-body"></div>
          <div class="modal-actions" id="modal-actions"></div>
        </div>
      </div>

      <!-- Toast Message -->
      <div id="toast-container"></div>
    </div>

    <footer>
      <p class="copyright">&copy; 2025 Vahala Designs</p>
    </footer>

    <!-- Leaflet & JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
  </body>
</html>
