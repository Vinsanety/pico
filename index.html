<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico - Peak Tracker</title>
    <link
      rel="icon"
      href="/logo/Pico-Summit-Log_ICON-LOGO.svg"
      type="image/svg+xml"
    />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside>
        <img src="/logo/Pico-Summit-Log_FULL-LOGO.svg" alt="Pico Summit Log" />
        <div class="muted">Log your summits and track your progress.</div>

        <div class="counts">
          <div class="chip">
            <strong>Your Summits:</strong> <span id="peak-count">0</span>
          </div>
        </div>

        <form id="peak-form">
          <label for="peak-input">Peak name</label>
          <input
            id="peak-input"
            type="text"
            placeholder="Start typing a peak…"
            autocomplete="off"
          />
          <ul id="suggestions"></ul>

          <label for="peak-elevation">Elevation (ft)</label>
          <input id="peak-elevation" type="number" placeholder="e.g. 14265" />

          <label for="peak-date">Date climbed</label>
          <input id="peak-date" type="date" />

          <button type="submit">Add peak</button>
        </form>

        <div id="peak-preview"></div>

        <h2 class="muted" style="margin-top: 16px">My peaks</h2>
        <ul id="peaks"></ul>
      </aside>

      <!-- Map -->
      <div id="map">
        <div id="preview-banner">🔍 Preview Mode — Click to exit</div>
      </div>
    </div>

    <footer>
      <p class="copyright">&copy; 2025 Vahala Designs</p>
    </footer>

    <!-- Leaflet & JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
  </body>
</html>
