<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico - Summit Log</title>
    <!-- Favicon  Support-->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Pico" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="banner">⚠️ Prototype Demo — Work in Progress ⚠️</div>

    <div class="app">
      <!-- Sidebar -->
      <aside>
        <header>
          <img
            src="/logo/Pico-Summit-Log_FULL-LOGO.svg"
            alt="Pico Summit Log"
          />
          <div class="muted">Log your summits and track your progress.</div>
        </header>

        <h3>Add a Summit</h3>
        <form id="peak-form">
          <div class="form-fields-container">
            <!-- Date Input -->
            <div class="form-field">
              <label for="peak-date">Date climbed</label>
              <input id="peak-date" type="date" />
            </div>

            <!-- Peak Name Combobox -->
            <div class="form-field">
              <label for="peak-input">Summit</label>
              <input
                id="peak-input"
                type="text"
                placeholder="Start typing a peak…"
                autocomplete="off"
              />
              <ul id="peak-suggestions"></ul>
            </div>

            <!-- Elevation Input -->
            <div class="form-field">
              <label for="peak-elevation">Elevation (ft)</label>
              <input
                id="peak-elevation"
                type="number"
                placeholder="e.g. 14265"
              />
            </div>
          </div>

          <!-- Preview Data before clicking submit button -->
          <div id="add-peak-preview"></div>

          <!-- Submit Button -->
          <button type="submit">Add peak</button>
        </form>

        <hr style="margin-top: 2rem" />

        <div class="my-summits-container">
          <h3 class="my-summits-heading">
            <strong>Total Summits:&nbsp;</strong>
            <span id="my-peak-count">-</span>
          </h3>

          <!-- Map/Table Toggle Button -->
          <div class="toggle-container">
            <input type="radio" id="map-view-radio" name="view" checked />
            <label for="map-view-radio">Map</label>

            <input type="radio" id="table-view-radio" name="view" />
            <label for="table-view-radio">Table</label>
          </div>

          <!-- Recent Summits List (last 5 logged)-->
          <span>Recent Logged Summits</span>
          <ul id="recent-summits-list"></ul>
        </div>
      </aside>

      <div id="view-wrapper">
        <!-- Map View -->
        <div id="map" class="view active">
          <button id="preview-mode-banner" type="button">
            🔍 Preview Mode — Click to exit
          </button>
        </div>

        <!-- Table View -->
        <div id="my-summits-table" class="view"></div>
      </div>

      <!-- Edit Peak Modal -->
      <div id="edit-submission-modal" class="modal hidden">
        <div class="modal-content">
          <h3>Edit Summit</h3>
          <form id="edit-form">
            <div class="form-field">
              <label for="edit-peak-date">Date climbed</label>
              <input id="edit-peak-date" type="date" name="date" />
            </div>
            <div class="modal-actions">
              <button type="submit">Save</button>
              <button type="button" id="cancel-edit" class="secondary-btn">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Toast Message -->
      <div id="toast-container"></div>
    </div>

    <footer>
      <p class="copyright">&copy; 2025 Vahala Designs</p>
    </footer>

    <!-- Leaflet & JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
  </body>
</html>
