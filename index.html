<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico - Summit Log</title>
    <link
      rel="icon"
      href="/logo/Pico-Summit-Log_ICON-LOGO.svg"
      type="image/svg+xml"
    />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside>
        <header>
          <img
            src="/logo/Pico-Summit-Log_FULL-LOGO.svg"
            alt="Pico Summit Log"
          />
          <div class="muted">Log your summits and track your progress.</div>
        </header>

        <div class="counts">
          <div class="chip">
            <strong>Your Summits:</strong> <span id="peak-count">0</span>
          </div>
        </div>

        <form id="peak-form">
          <div class="form-fields-container">
            <!-- Date Input -->
            <div class="form-field">
              <label for="peak-date">Date climbed</label>
              <input id="peak-date" type="date" />
            </div>

            <!-- Peak Name Combobox -->
            <div class="form-field">
              <label for="peak-input">Summit</label>
              <input
                id="peak-input"
                type="text"
                placeholder="Start typing a peak…"
                autocomplete="off"
              />
              <ul id="suggestions"></ul>
            </div>

            <!-- Elevation Input -->
            <div class="form-field">
              <label for="peak-elevation">Elevation (ft)</label>
              <input
                id="peak-elevation"
                type="number"
                placeholder="e.g. 14265"
              />
            </div>
          </div>

          <!-- Preview Data before clickign submit button -->
          <div id="peak-preview"></div>

          <!-- Submit Button -->
          <button type="submit">Add peak</button>
        </form>

        <h2 class="muted" style="margin-top: 16px">My peaks</h2>
        <ul id="my-peaks"></ul>
      </aside>

      <!-- Map -->
      <div id="map">
        <div id="preview-banner">🔍 Preview Mode — Click to exit</div>
      </div>
    </div>

    <!-- Toast Message -->
    <div id="toast-container"></div>

    <footer>
      <p class="copyright">&copy; 2025 Vahala Designs</p>
    </footer>

    <!-- Leaflet & JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
