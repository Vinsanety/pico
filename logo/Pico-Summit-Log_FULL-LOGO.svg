<svg viewBox="0 0 520 155" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Pico Summit Log</title>
  <desc id="desc">Adventure/outdoors logo with main mountain peak, compass, and text.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="155" fill="#0f172a" />

  <!-- Sun -->
  <circle cx="125" cy="55" r="28" fill="#F0B429" />

  <!-- Mountain group -->
  <g transform="translate(40,25)">
    <!-- Far ridge -->
    <path d="M15 110 L70 45 L100 75 L130 60 L160 110 Z" fill="#3D5A73" />
    <!-- Main peak -->
    <path d="M40 110 L110 20 L180 110 Z" fill="#2C5F2D" />
    <!-- Snow cap -->
    <path d="M96 38 L110 20 L124 38 L106 42 Z" fill="#E6F2F0" />
    <!-- Summit flag -->
    <!-- Flagpole -->
    <line x1="110" y1="21" x2="110" y2="-10" stroke="#FFFFFF" stroke-width="2" />
    <!-- Flag cloth -->
    <polygon points="110,-10 130,-5 110,0" fill="red" />
  </g>

  <!-- Tracking path -->
  <path d="M155,95 C200,80 220,90 240,95 S285,110 310,105" stroke="#E6F2F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.9" />
  <circle cx="310" cy="105" r="6.5" fill="red" stroke="#FFFFFF" stroke-width="2" />

  <!-- Title -->
  <text x="350" y="85" font-family="Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">PICO</text>
  <text x="350" y="115" font-family="Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#89CFF0">SUMMIT LOG</text>

  <!-- Underline -->
  <rect x="350" y="123" width="125" height="4" fill="#2C5F2D" opacity="0.7" />
</svg>